{% extends "base.html" %}
{% block title %}Anmelden · Weltenbummler{% endblock %}
{% block body %}
<main class="card">
  <h1>Weltenbummler</h1>
  {% include "_flash.html" %}
  <form method="post" action="{{ url_for('login_post') }}">
    <label>Vorname <input name="name" value="{{ name or '' }}" autocomplete="username" autocapitalize="words" required autofocus></label>
    <label>Passwort <input name="password" type="password" autocomplete="current-password" required></label>
    <button type="submit">Anmelden</button>
  </form>
</main>
{% endblock %}
