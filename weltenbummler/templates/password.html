{% extends "base.html" %}
{% block title %}Passwort · Weltenbummler{% endblock %}
{% block body %}
<main class="card">
  <p><a href="{{ url_for('index') }}">&larr; Zur Karte</a></p>
  <h1>Passwort ändern</h1>
  {% include "_flash.html" %}
  <form method="post" action="{{ url_for('password_post') }}">
    <input type="hidden" name="username" value="{{ g.user['name'] }}" autocomplete="username">
    <label>Bisheriges Passwort <input name="old" type="password" autocomplete="current-password" required></label>
    <label>Neues Passwort <input name="new" type="password" autocomplete="new-password" minlength="8" required></label>
    <button type="submit">Ändern</button>
  </form>
</main>
{% endblock %}
